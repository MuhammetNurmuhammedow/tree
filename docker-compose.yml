services:
  postgres:
    image: postgres:16-alpine
    container_name: familytree_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-familytree}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-familytree}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-familytree}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: familytree_api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familytree_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/migrations:/app/migrations

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: familytree_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/app/dist

volumes:
  postgres_data:
